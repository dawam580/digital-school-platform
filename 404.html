<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; url=./">
    <title>منصة المدرسة الرقمية</title>
    <script type="text/javascript">
      // SPA redirect for GitHub Pages
      var pathSegmentsToKeep = 1;
      var l = window.location;
      if (l.pathname.includes('/digital-school-platform')) {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          '/digital-school-platform/' +
          (l.search || '') +
          (l.hash || '')
        );
      } else {
        l.replace('./');
      }
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 50px; direction: rtl;">
    <h3>جاري تحميل منصة المدرسة الرقمية...</h3>
    <p><a href="./">اضغط هنا إذا لم يتم التحويل تلقائياً</a></p>
  </body>
</html>

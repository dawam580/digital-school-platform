<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">
<!-- Login Container -->
<main class="w-full max-w-md">
<!-- Logo Area -->
<div class="flex flex-col items-center justify-center mb-8">
<div class="w-24 h-24 rounded-full bg-surface-container-low flex items-center justify-center shadow-sm overflow-hidden mb-4">
<img alt="منصة المدرسة Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBfAxeycyuSkch-njGrBIH5C8qH0cIP2w-UE17BxUfyJaJ03_4EAD0scpSQcoDfK9h246qPL7bmX-EqPJD_lLJiwC4CV3ngM5skkWDyw8gOqPb2-TfS8espUteZEXX02RRqE7sU7z9_Wt62hJdjxuL6To3hXe492qWImMnsqppdsyYHdsHw_9Rr3cijiezQwqGTqRVJTusMJgepc_Y5Z-Dys4cwKP-MtudKU5rlkadJTRTt8703mwCO"/>
</div>
<h1 class="font-display-md text-display-md text-primary">منصة المدرسة</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">نظام الإدارة المدرسية المتكامل</p>
</div>
<!-- Login Card (Level 1 Surface) -->
<div class="bg-surface-container-lowest rounded-xl shadow-level-1 p-lg md:p-xl">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-6 text-center">تسجيل الدخول</h2>
<form action="#" class="space-y-6" method="POST">
<!-- Phone Number Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="phone">رقم الهاتف</label>
<div class="relative">
<div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" data-icon="phone_iphone">phone_iphone</span>
</div>
<input class="bg-surface-container-lowest border border-outline text-on-surface font-body-md text-body-md rounded-lg block w-full pr-10 p-2.5 input-glow transition-all duration-200 outline-none" dir="ltr" id="phone" name="phone" placeholder="05X XXX XXXX" required="" type="tel"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="password">كلمة المرور</label>
<div class="relative">
<div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" data-icon="lock">lock</span>
</div>
<input class="bg-surface-container-lowest border border-outline text-on-surface font-body-md text-body-md rounded-lg block w-full pr-10 p-2.5 input-glow transition-all duration-200 outline-none" dir="ltr" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full text-on-primary bg-primary-container hover:bg-primary-container/90 focus:ring-4 focus:outline-none focus:ring-primary-container/30 font-label-md text-label-md rounded-lg px-5 py-3 text-center transition-colors duration-200 flex justify-center items-center gap-2" type="submit">
<span>تسجيل الدخول</span>
<span class="material-symbols-outlined text-on-primary" data-icon="login">login</span>
</button>
</form>
<!-- Links Section -->
<div class="mt-8 flex flex-col items-center space-y-4">
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed-dim transition-colors duration-200" href="#">
                    نسيت كلمة المرور؟
                </a>
<div class="w-full border-t border-outline-variant/30 my-4"></div>
<p class="font-body-sm text-body-sm text-on-surface-variant">

                    <a class="font-label-md text-label-md text-secondary hover:text-secondary-container transition-colors duration-200 mr-1" href="#">

                    </a>

# نشر خادم تطبيق أولياء الأمور على Render بنقرة واحدة:
# render.com ← New ← Blueprint ← اختر هذا المستودع ← Apply
services:
  - type: web
    name: madrasa-parents
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: DATA_DIR
        value: /data
    # الخطة المجانية بلا قرص دائم: إن أُعيد تشغيل الخادم تعيد حواسيب المدارس رفع
    # كل شيء تلقائياً خلال دقائق، وهواتف أولياء الأمور تعيد إرسال ما لم يصل.
    # عند الترقية (Starter) أزل التعليق لقرص دائم:
    # disk:
    #   name: relay-data
    #   mountPath: /data
    #   sizeGB: 1
